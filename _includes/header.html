{% assign is_dark = false %}
{% if page.body_class contains 'hero-dark' %}
  {% assign is_dark = true %}
{% endif %}

<header id="main-header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent">
  <div class="container mx-auto px-4">
    <div class="py-4 flex justify-between items-center">
      <!-- Logo -->
      <a href="{{ '/' | relative_url }}" class="relative z-10 flex items-center gap-2">
        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div class="flex flex-col leading-none">
          <span class="text-lg font-bold tracking-tight nav-icon {% if is_dark %}text-white{% else %}text-gray-900{% endif %}">ЭЛЕКТРО</span>
          <span class="text-xs font-semibold {% if is_dark %}text-blue-400{% else %}text-blue-600{% endif %} tracking-widest">ШУГАМ</span>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex gap-8 items-center">
        <a href="{{ '/' | relative_url }}" class="nav-link text-sm font-semibold tracking-wide uppercase transition-colors {% if is_dark %}text-white/90 hover:text-white{% else %}text-gray-700 hover:text-blue-600{% endif %}">Нүүр</a>
        <a href="{{ '/services/' | relative_url }}" class="nav-link text-sm font-semibold tracking-wide uppercase transition-colors {% if is_dark %}text-white/90 hover:text-white{% else %}text-gray-700 hover:text-blue-600{% endif %}">Үйлчилгээ</a>
        <a href="{{ '/about/' | relative_url }}" class="nav-link text-sm font-semibold tracking-wide uppercase transition-colors {% if is_dark %}text-white/90 hover:text-white{% else %}text-gray-700 hover:text-blue-600{% endif %}">Бидний тухай</a>
        <a href="{{ '/contact/' | relative_url }}" class="nav-link text-sm font-semibold tracking-wide uppercase transition-colors {% if is_dark %}text-white/90 hover:text-white{% else %}text-gray-700 hover:text-blue-600{% endif %}">Холбоо барих</a>
      </nav>

      <!-- Mobile Hamburger -->
      <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg hover:bg-gray-100/50 transition-colors relative z-50" aria-label="Toggle menu">
        <svg class="w-6 h-6 nav-icon {% if is_dark %}text-white{% else %}text-gray-900{% endif %}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="mobile-menu fixed inset-0 z-40 bg-white md:hidden flex-col items-center justify-center h-full gap-8">
    <button id="mobile-menu-close" class="absolute top-6 right-6 p-2" aria-label="Close menu">
      <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    <a href="{{ '/' | relative_url }}" class="mobile-nav-link text-2xl font-bold text-gray-900 hover:text-blue-600 transition-colors">Нүүр</a>
    <a href="{{ '/about/' | relative_url }}" class="mobile-nav-link text-2xl font-bold text-gray-900 hover:text-blue-600 transition-colors">Бидний тухай</a>
    <a href="{{ '/services/' | relative_url }}" class="mobile-nav-link text-2xl font-bold text-gray-900 hover:text-blue-600 transition-colors">Үйлчилгээ</a>
    <a href="{{ '/contact/' | relative_url }}" class="mobile-nav-link text-2xl font-bold text-gray-900 hover:text-blue-600 transition-colors">Холбоо барих</a>
  </div>
</header>
